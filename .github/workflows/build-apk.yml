name: TITONOX APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TITONOX APK
    runs-on: ubuntu-latest

    steps:

      # 1. GitHub repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java - NO GRADLE CACHE HERE
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 4. Find uploaded ZIP
      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 5. Extract project
      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -o "${{ steps.zip.outputs.zip }}" \
            -d android-project

      # 6. Locate actual Gradle project
      - name: Locate Gradle project
        shell: bash
        run: |
          PROJECT_DIR=$(find android-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            echo "Extracted files:"
            find android-project -maxdepth 5 -type f
            exit 1
          fi

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 7. Download exact Gradle version
      - name: Install Gradle 9.3.1
        run: |
          curl -L --fail \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"

          gradle --version

      # 8. Create debug signing key
      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 9. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================="
          echo "TITONOX ANDROID BUILD"
          echo "=============================="

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # 10. Locate APK
      - name: Locate APK
        run: |
          echo "APK OUTPUT:"
          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

      # 11. Prepare APK
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" release/TITONOX-debug.apk

          ls -lh release/TITONOX-debug.apk

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITONOX-APK
          path: release/TITONOX-debug.apk
          if-no-files-found: error
